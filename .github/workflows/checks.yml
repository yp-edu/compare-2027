name: Checks

on:
  pull_request:

permissions:
  actions: read
  contents: read
  deployments: read
  statuses: write

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - compare-2027: format'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - compare-2027: lint'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - compare-2027: typecheck'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  vitest:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compare_2027_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BETTER_AUTH_SECRET: test-better-auth-secret
      PAYLOAD_SECRET: test-payload-secret
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/compare_2027_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - compare-2027: vitest'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm payload migrate

      - name: Run Vitest
        run: pnpm test:int

  playwright:
    name: Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - compare-2027: playwright'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chrome

      - name: Wait for Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..60}; do
            deployments=$(gh api --method GET "repos/$REPOSITORY/deployments" -f sha="$PR_HEAD_SHA" -f environment=Preview)
            deployment_id=$(jq -r '.[0].id // empty' <<< "$deployments")

            if [ -n "$deployment_id" ]; then
              statuses=$(gh api --method GET "repos/$REPOSITORY/deployments/$deployment_id/statuses")
              preview_url=$(jq -r '[.[] | select(.state == "success")][0] | .environment_url // .target_url // empty' <<< "$statuses")
              failed_state=$(jq -r '[.[] | select(.state == "failure" or .state == "error")][0].state // empty' <<< "$statuses")

              if [ -n "$preview_url" ]; then
                echo "url=$preview_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [ -n "$failed_state" ]; then
                echo "Vercel preview deployment finished with state: $failed_state" >&2
                exit 1
              fi
            fi

            echo "Waiting for Vercel preview deployment for $PR_HEAD_SHA (attempt $attempt/60)..."
            sleep 10
          done

          echo "Timed out waiting for a successful Vercel preview deployment for $PR_HEAD_SHA." >&2
          exit 1

      - name: Run Playwright
        env:
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
